services:
  # Memory limits are tuned for a 1 vCPU / 1 GB RAM VPS — see deploy.sh.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=48MB", "-c", "max_connections=20"]
    mem_limit: 200m
    environment:
      POSTGRES_USER: openbridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: openbridge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbridge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    mem_limit: 80m
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    mem_limit: 300m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://openbridge:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/openbridge
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      UPLOAD_SCAN_ENABLED: ${UPLOAD_SCAN_ENABLED:-false}
      # Point at your clamd container/host if you enable scanning.
      CLAMAV_HOST: ${CLAMAV_HOST:-127.0.0.1}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      FILE_URL_SECRET: ${FILE_URL_SECRET:-}
      FILE_URL_TTL_SECONDS: ${FILE_URL_TTL_SECONDS:-604800}
      PORT: 3000
    volumes:
      - uploads:/app/uploads
    # The CMD runs `prisma db push` before booting, so the first check has to
    # wait for a schema sync on a 1 vCPU box.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 120s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    mem_limit: 60m
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

volumes:
  pgdata:
  redisdata:
  uploads:
