services:
  # Memory limits are tuned for a 1 vCPU / 1 GB RAM VPS — see deploy.sh.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=48MB", "-c", "max_connections=20"]
    mem_limit: 200m
    environment:
      POSTGRES_USER: openbridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: openbridge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbridge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    mem_limit: 80m
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    mem_limit: 300m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://openbridge:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/openbridge
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CONTENT_KEY: ${CONTENT_KEY:?set CONTENT_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      UPLOAD_SCAN_ENABLED: ${UPLOAD_SCAN_ENABLED:-false}
      # Point at your clamd container/host if you enable scanning.
      CLAMAV_HOST: ${CLAMAV_HOST:-127.0.0.1}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      FILE_URL_SECRET: ${FILE_URL_SECRET:-}
      FILE_URL_TTL_SECONDS: ${FILE_URL_TTL_SECONDS:-604800}
      # LiveKit is optional at boot: leaving these empty answers 503 on call
      # endpoints while chat keeps working. The compose `livekit` service below
      # requires real values, so a production boot cannot silently run without
      # a media server once LiveKit is part of the stack.
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_URL: ${LIVEKIT_API_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      CALL_RING_TIMEOUT_SECONDS: ${CALL_RING_TIMEOUT_SECONDS:-45}
      CALL_TOKEN_TTL_SECONDS: ${CALL_TOKEN_TTL_SECONDS:-600}
      CALL_MAX_DURATION_SECONDS: ${CALL_MAX_DURATION_SECONDS:-14400}
      CALL_MAX_GROUP_PARTICIPANTS: ${CALL_MAX_GROUP_PARTICIPANTS:-20}
      PORT: 3000
    volumes:
      - uploads:/app/uploads
    # The CMD runs `prisma db push` before booting, so the first check has to
    # wait for a schema sync on a 1 vCPU box.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 120s

  # Self-hosted media SFU. It speaks WebSocket on 7880 (reverse-proxied by nginx
  # at /livekit/), ICE/TCP on 7881 and WebRTC UDP on 7882. 7880 is deliberately
  # not published: only nginx and the API reach it on the compose network.
  #
  # A 1 GB box is enough for a small 1:1 call but tight for group video; the
  # deployment guide recommends 2 vCPU / 4 GB and the UDP port must be open in
  # the provider firewall. TURN can be enabled inside LIVEKIT_CONFIG below when
  # clients sit behind restrictive NATs; see docs/engineering/CALLING_ARCHITECTURE.md.
  livekit:
    image: livekit/livekit-server:v1.13.10
    restart: unless-stopped
    mem_limit: 320m
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}"
      # The server reads LIVEKIT_CONFIG as its YAML config body, so no secret is
      # baked into the repository image or a committed config file.
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://api:3000/api/calls/webhook
        logging:
          level: info
        # Uncomment on networks where UDP is blocked; this requires a public
        # TLS certificate for the TURN domain and open 5349/tcp + 3478/udp.
        # turn:
        #   enabled: true
        #   domain: turn.example.com
        #   tls_port: 5349
        #   udp_port: 3478
    ports:
      - "7881:7881"
      - "7882:7882/udp"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    mem_limit: 60m
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

volumes:
  pgdata:
  redisdata:
  uploads:
