name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch replaces a PR run; a main run is not killed
# mid-flight because the emulator job is long.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '20'

jobs:
  changes:
    name: '0 · Change detection'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mobile: ${{ steps.detect.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF" --depth=1
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -Eq '^(mobile/|shared/e2ee/|\.github/workflows/ci\.yml)'; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Stage 1 · static checks ───────────────────────────────────────
  # Fast, dependency-only jobs that fail before anything spends time on
  # databases or Docker.
  web-lint:
    name: '1a · Web lint'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint

  backend-check:
    name: '1b · Backend schema and typecheck'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `prisma validate` resolves the datasource's env() reference before it reads
    # the schema, so it fails on a checkout that has no .env — which is every CI
    # run. The value is never connected to here; generate, validate and
    # `nest build` only need it to exist.
    env:
      DATABASE_URL: postgresql://openbridge:openbridge@localhost:5432/openbridge
      JWT_SECRET: ci-only-secret-at-least-32-characters-long-0000
      CONTENT_KEY: Y2ktb25seS1jb250ZW50LWtleS0zMi1ieXRlcy0wMDA=
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      # nest build is the typecheck: the backend has no separate lint setup.
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist
          retention-days: 7

  # ── Stage 2 · tests ───────────────────────────────────────────────
  backend-e2e:
    name: '2 · Backend e2e (PostgreSQL)'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend-check
    # Presence lives in-process, so no Redis service is needed here.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openbridge
          POSTGRES_PASSWORD: openbridge
          POSTGRES_DB: openbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://openbridge:openbridge@localhost:5432/openbridge
      JWT_SECRET: ci-only-secret-at-least-32-characters-long-0000
      CONTENT_KEY: Y2ktb25seS1jb250ZW50LWtleS0zMi1ieXRlcy0wMDA=
      NODE_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # The client-level suite boots the API and drives the real MLS core from
      # shared/e2ee, which resolves its crypto dependencies from the root
      # manifest. Without this install the backend job cannot import that core,
      # so the suite that proves "the server only ever sees ciphertext" would
      # silently not run.
      - name: Install the root (client) dependencies
        working-directory: .
        run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
      # Builds first, then runs the suite against the real PostgreSQL instance.
      - run: npm run test:e2e

  # The Phase 0 library gate from docs/engineering/E2EE_DESIGN.md, kept
  # executable: the pure-JS provider must run MLS, interoperate with the
  # WebCrypto path, and need no crypto.subtle (the Hermes condition).
  e2ee-gate:
    name: '2b · E2EE library gate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: web-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:e2ee

  mobile-tests:
    name: '2d · Mobile unit tests (Jest + RNTL)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run test:ci

  # Informational: reports without blocking the pipeline.
  dependencies:
    name: '2c · Dependency audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    strategy:
      matrix:
        dir: ['.', 'backend']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: ${{ matrix.dir }}
      - run: npm audit --omit=dev --audit-level=high
        working-directory: ${{ matrix.dir }}

  # ── Stage 3 · build the shipped artefacts ─────────────────────────
  web-build:
    name: '3a · Web build'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: web-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: /api
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 7

  mobile-bundle:
    name: '3b · Mobile bundle (Android)'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_NO_TELEMETRY: 1
      CI: true
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      # Bundles the Hermes JS payload — no Android SDK or device involved.
      - run: npx expo export --platform android --output-dir dist-ci
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android-bundle
          path: mobile/dist-ci
          retention-days: 7

  mobile-e2e:
    name: '2e · Mobile E2E (Android emulator)'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [changes, mobile-tests]
    if: needs.changes.outputs.mobile == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openbridge
          POSTGRES_PASSWORD: openbridge
          POSTGRES_DB: openbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://openbridge:openbridge@localhost:5432/openbridge
      JWT_SECRET: ci-only-secret-at-least-32-characters-long-0000
      CONTENT_KEY: Y2ktb25seS1jb250ZW50LWtleS0zMi1ieXRlcy0wMDA=
      NODE_ENV: development
      PORT: '3000'
      # 10.0.2.2 is the emulator's alias for the runner host, where the API is
      # started above. Inside the emulator 127.0.0.1 is the emulated device
      # itself, so the app baked with this URL can never reach the API.
      EXPO_PUBLIC_API_URL: http://10.0.2.2:3000/api
      EXPO_NO_TELEMETRY: '1'
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install and build the backend
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx prisma db push --skip-generate
          npm run build

      - name: Start the backend
        working-directory: backend
        run: |
          node dist/main > /tmp/openbridge-api.log 2>&1 &
          echo $! > /tmp/openbridge-api.pid

      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health/ready; then exit 0; fi
            sleep 1
          done
          cat /tmp/openbridge-api.log
          exit 1

      - name: Seed the E2E users and group
        working-directory: backend
        run: node test/mobile-e2e-seed.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate the Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Point the generated manifest at the local HTTP API
        run: |
          node -e "const fs=require('fs');const p='mobile/android/app/src/main/AndroidManifest.xml';let s=fs.readFileSync(p,'utf8');if(!s.includes('usesCleartextTraffic')){s=s.replace('<application ','<application android:usesCleartextTraffic=\"true\" ');fs.writeFileSync(p,s)}"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build the release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -x lint -x test

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro 2.11.0
        run: |
          curl -fsSL -o /tmp/maestro.zip https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.11.0/maestro.zip
          unzip -q /tmp/maestro.zip -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro on the emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # The action runs the `script` input one line per sh process, so the
          # multi-line flow lives in the script this single command executes.
          script: bash .github/scripts/mobile-e2e-run.sh

      - name: Upload the E2E report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-artifacts
          path: |
            ${{ runner.temp }}/maestro-report-*.xml
            ${{ runner.temp }}/maestro-*.log
            ${{ runner.temp }}/maestro-debug
            ${{ runner.temp }}/emulator-failure.png
            ${{ runner.temp }}/hierarchy.xml
            ${{ runner.temp }}/launch.png
            ${{ runner.temp }}/launch.log
            ${{ runner.temp }}/adb-install.log
            ${{ runner.temp }}/logcat.txt
            ${{ runner.temp }}/logcat-launch.txt
            /home/runner/.maestro/tests
            mobile/.maestro/**/*.png
            e2e-chat-after-reaction.png
          if-no-files-found: ignore
          retention-days: 7

  # ── Stage 4 · dry-run the path that actually ships ────────────────
  # The VPS deploys with `docker compose up -d --build`, so CI has to prove
  # both images build and the nginx → API wiring answers, not just that the
  # sources compile.
  deploy-dry-run:
    name: '4 · Docker images + compose smoke test'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-check, web-build]
    env:
      POSTGRES_PASSWORD: ci-only-password
      JWT_SECRET: ci-only-secret-at-least-32-characters-long-0000
      CONTENT_KEY: Y2ktb25seS1jb250ZW50LWtleS0zMi1ieXRlcy0wMDA=
      WEB_PORT: '8080'
      # The compose stack includes the self-hosted media server. These are test
      # values; no call is placed by the smoke test.
      LIVEKIT_API_KEY: ci-only-livekit-key
      LIVEKIT_API_SECRET: ci-only-livekit-secret-at-least-32-characters
      LIVEKIT_URL: ws://localhost/livekit
      LIVEKIT_API_URL: http://livekit:7880
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d
      - name: Wait for the API through nginx
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:${WEB_PORT}/api/health/ready | grep -q '"status":"ok"'; then
              curl -fsS http://localhost:${WEB_PORT}/api/health/ready; echo; exit 0
            fi
            sleep 5
          done
          echo "API never became healthy through nginx" >&2
          docker compose ps
          docker compose logs --no-color api | tail -60
          exit 1
      - name: Check the SPA, the security headers and the Socket.IO handshake
        run: |
          curl -fsS http://localhost:${WEB_PORT}/ | grep -qi '<div id="root">'
          curl -fsS "http://localhost:${WEB_PORT}/socket.io/?EIO=4&transport=polling" -o /tmp/handshake
          grep -q '"sid"' /tmp/handshake

          # The headers are added in nginx.conf; this asserts they survive both
          # the SPA location and the API proxy, and that the version banner is
          # gone.
          assert_headers() {
            local url="$1" label="$2" headers
            headers=$(curl -fsS -D - -o /dev/null "$url")
            echo "$headers" | grep -qi '^x-content-type-options: nosniff' || { echo "missing nosniff on $label" >&2; exit 1; }
            echo "$headers" | grep -qi '^x-frame-options: DENY' || { echo "missing frame deny on $label" >&2; exit 1; }
            echo "$headers" | grep -qi '^referrer-policy: no-referrer' || { echo "missing referrer policy on $label" >&2; exit 1; }
            if echo "$headers" | grep -qiE '^server: nginx/[0-9]'; then echo "nginx version leaked on $label" >&2; exit 1; fi
          }
          assert_headers "http://localhost:${WEB_PORT}/" SPA
          assert_headers "http://localhost:${WEB_PORT}/api/health" API
      - name: Container health report
        run: docker compose ps
      - if: always()
        run: docker compose down -v --remove-orphans

  # ── Gate ──────────────────────────────────────────────────────────
  # The single check to make required in branch protection, so the list of
  # jobs can change without breaking the protection rule.
  ci-gate:
    name: 'CI gate'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, web-lint, backend-check, backend-e2e, e2ee-gate, mobile-tests, mobile-e2e, web-build, mobile-bundle, deploy-dry-run]
    if: always()
    steps:
      - name: Summarise
        run: |
          echo "mobile-tests: ${{ needs.mobile-tests.result }}"
          echo "mobile-e2e:   ${{ needs.mobile-e2e.result }} (mobile=${{ needs.changes.outputs.mobile }})"
          [ "${{ needs.changes.result }}" = "success" ] || exit 1
          [ "${{ needs.web-lint.result }}" = "success" ] || exit 1
          [ "${{ needs.backend-check.result }}" = "success" ] || exit 1
          [ "${{ needs.backend-e2e.result }}" = "success" ] || exit 1
          [ "${{ needs.e2ee-gate.result }}" = "success" ] || exit 1
          [ "${{ needs.mobile-tests.result }}" = "success" ] || exit 1
          [ "${{ needs.web-build.result }}" = "success" ] || exit 1
          [ "${{ needs.mobile-bundle.result }}" = "success" ] || exit 1
          [ "${{ needs.deploy-dry-run.result }}" = "success" ] || exit 1
          # The emulator is skipped only when change detection says this is a
          # web-only PR. A skip on main, or with mobile=true, is a failure.
          if [ "${{ needs.mobile-e2e.result }}" = "success" ]; then
            exit 0
          fi
          if [ "${{ needs.mobile-e2e.result }}" = "skipped" ] && [ "${{ needs.changes.outputs.mobile }}" != "true" ]; then
            echo "mobile-e2e skipped: no mobile/shared changes in this PR."
            exit 0
          fi
          echo "::error::mobile-e2e result=${{ needs.mobile-e2e.result }} mobile=${{ needs.changes.outputs.mobile }}"
          exit 1
