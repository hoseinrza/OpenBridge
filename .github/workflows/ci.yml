name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch replaces the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ── Stage 1 · static checks ───────────────────────────────────────
  # Fast, dependency-only jobs that fail before anything spends time on
  # databases or Docker.
  web-lint:
    name: '1a · Web lint'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint

  backend-check:
    name: '1b · Backend schema and typecheck'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      # nest build is the typecheck: the backend has no separate lint setup.
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist
          retention-days: 7

  # ── Stage 2 · tests ───────────────────────────────────────────────
  backend-e2e:
    name: '2 · Backend e2e (PostgreSQL)'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend-check
    # Presence lives in-process, so no Redis service is needed here.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openbridge
          POSTGRES_PASSWORD: openbridge
          POSTGRES_DB: openbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://openbridge:openbridge@localhost:5432/openbridge
      JWT_SECRET: ci-only-secret-at-least-32-characters-long-0000
      NODE_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
      # Builds first, then runs the suite against the real PostgreSQL instance.
      - run: npm run test:e2e

  # The Phase 0 library gate from docs/engineering/E2EE_DESIGN.md, kept
  # executable: the pure-JS provider must run MLS, interoperate with the
  # WebCrypto path, and need no crypto.subtle (the Hermes condition).
  e2ee-gate:
    name: '2b · E2EE library gate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: web-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:e2ee

  # Informational: reports without blocking the pipeline.
  dependencies:
    name: '2c · Dependency audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    strategy:
      matrix:
        dir: ['.', 'backend']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: ${{ matrix.dir }}
      - run: npm audit --omit=dev --audit-level=high
        working-directory: ${{ matrix.dir }}

  # ── Stage 3 · build the shipped artefacts ─────────────────────────
  web-build:
    name: '3a · Web build'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: web-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: /api
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 7

  mobile-bundle:
    name: '3b · Mobile bundle (Android)'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_NO_TELEMETRY: 1
      CI: true
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      # Bundles the Hermes JS payload — no Android SDK or device involved.
      - run: npx expo export --platform android --output-dir dist-ci
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android-bundle
          path: mobile/dist-ci
          retention-days: 7

  # ── Stage 4 · dry-run the path that actually ships ────────────────
  # The VPS deploys with `docker compose up -d --build`, so CI has to prove
  # both images build and the nginx → API wiring answers, not just that the
  # sources compile.
  deploy-dry-run:
    name: '4 · Docker images + compose smoke test'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-check, web-build]
    env:
      POSTGRES_PASSWORD: ci-only-password
      JWT_SECRET: ci-only-secret-at-least-32-characters-long-0000
      WEB_PORT: '8080'
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d
      - name: Wait for the API through nginx
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:${WEB_PORT}/api/health | grep -q '"status":"ok"'; then
              curl -fsS http://localhost:${WEB_PORT}/api/health; echo; exit 0
            fi
            sleep 5
          done
          echo "API never became healthy through nginx" >&2
          docker compose ps
          docker compose logs --no-color api | tail -60
          exit 1
      - name: Check the SPA and the Socket.IO handshake
        run: |
          curl -fsS http://localhost:${WEB_PORT}/ | grep -qi '<div id="root">'
          curl -fsS "http://localhost:${WEB_PORT}/socket.io/?EIO=4&transport=polling" -o /tmp/handshake
          grep -q '"sid"' /tmp/handshake
      - name: Container health report
        run: docker compose ps
      - if: always()
        run: docker compose down -v --remove-orphans

  # ── Gate ──────────────────────────────────────────────────────────
  # The single check to make required in branch protection, so the list of
  # jobs can change without breaking the protection rule.
  ci-gate:
    name: 'CI gate'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [web-lint, backend-check, backend-e2e, e2ee-gate, web-build, mobile-bundle, deploy-dry-run]
    if: always()
    steps:
      - name: Summarise
        run: |
          echo "backend-e2e: ${{ needs.backend-e2e.result }}"
          echo "e2ee-gate:   ${{ needs.e2ee-gate.result }}"
          echo "web-build:   ${{ needs.web-build.result }}"
          echo "mobile:      ${{ needs.mobile-bundle.result }}"
          echo "dry-run:     ${{ needs.deploy-dry-run.result }}"
          # `success` only — a skipped dependency must not look green.
          [ "${{ needs.web-lint.result }}" = "success" ] \
            && [ "${{ needs.backend-check.result }}" = "success" ] \
            && [ "${{ needs.backend-e2e.result }}" = "success" ] \
            && [ "${{ needs.e2ee-gate.result }}" = "success" ] \
            && [ "${{ needs.web-build.result }}" = "success" ] \
            && [ "${{ needs.mobile-bundle.result }}" = "success" ] \
            && [ "${{ needs.deploy-dry-run.result }}" = "success" ]
