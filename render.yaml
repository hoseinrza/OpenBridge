# Render Blueprint — deploys the OpenBridge backend (NestJS + WebSocket) and a
# managed PostgreSQL database. Import this repo at https://dashboard.render.com
# → New → Blueprint, and Render will provision everything below.
databases:
  - name: openbridge-db
    plan: free
    databaseName: openbridge
    user: openbridge

services:
  - type: web
    name: openbridge-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push --skip-generate && node dist/main
    healthCheckPath: /api/health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: openbridge-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Base64 of exactly 32 random bytes (`openssl rand -base64 32`). Must be
      # set in the dashboard before the first deploy: the API will not start
      # without it, and rotating it makes existing sealed rows unreadable.
      - key: CONTENT_KEY
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      # Set this to the deployed frontend origin, e.g. https://your-app.vercel.app
      - key: CORS_ORIGINS
        sync: false
      - key: NODE_VERSION
        value: 20.11.1
